name: CI
on:
  push:
    branches:
      - main
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LANDFIRE_EMAIL: ${{ secrets.LANDFIRE_EMAIL }}
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  docs-render:
    name: Docs render smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANDFIRE_EMAIL: ${{ secrets.LANDFIRE_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install lcov
        run: sudo apt-get install -y lcov
      - name: Install docs dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Render docs
        run: quarto render docs

  # Single aggregate check required by branch protection; "CI success" must match
  # REQUIRED_CI_CHECK in JuliaPackageTemplate's generate().
  ci-success:
    name: CI success
    if: always()
    needs: [test, docs-render]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
